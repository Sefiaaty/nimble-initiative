<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chat.css?v=6c220fb8"></head>
<body>
<div id="chat">
  <header><span class="t">Table chat</span><button id="close" title="Hide the chat (the 💬 on the party bar brings it back)">✕</button></header>
  <div id="log"></div>
  <div id="picker" hidden>
    <form id="gsearch" autocomplete="off"><input type="text" placeholder="Search GIFs, then Enter"><button type="button" id="pclose" title="Close">✕</button></form>
    <div id="grid"></div>
    <div id="pfoot"></div>
  </div>
  <form id="send" autocomplete="off">
    <button type="button" id="gifbtn" title="Find a GIF (type words first to search for them)">GIF</button>
    <input type="text" maxlength="140" placeholder="Say something, or /gif and a few words">
    <button type="submit" id="go">Send</button>
  </form>
</div>
<script type="module" src="chat.js?v=6c220fb8"></script>
</body></html>
